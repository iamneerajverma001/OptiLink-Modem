<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700">
  <rect width="1400" height="700" fill="#020617"/>
  <rect x="70" y="70" width="1260" height="560" rx="28" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
  <text x="700" y="125" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" fill="#f8fafc">TX / RX System Block Diagram</text>

  <rect x="140" y="220" width="220" height="140" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="250" y="275" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#f8fafc">Input</text>
  <text x="250" y="308" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#cbd5e1">User / UART</text>

  <rect x="430" y="220" width="220" height="140" rx="18" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="540" y="275" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#f8fafc">TX Core</text>
  <text x="540" y="308" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#cbd5e1">Frame + Packet</text>

  <rect x="720" y="220" width="220" height="140" rx="18" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
  <text x="830" y="275" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#f8fafc">Optical Link</text>
  <text x="830" y="308" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#cbd5e1">Channel</text>

  <rect x="1010" y="220" width="220" height="140" rx="18" fill="#1e293b" stroke="#2dd4bf" stroke-width="2"/>
  <text x="1120" y="275" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#f8fafc">RX Core</text>
  <text x="1120" y="308" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#cbd5e1">DSP + DPLL + MAC</text>

  <rect x="430" y="460" width="520" height="110" rx="18" fill="#0f766e" stroke="#2dd4bf" stroke-width="2"/>
  <text x="690" y="515" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#ecfeff">Telemetry + Diagnostics + Config</text>

  <line x1="360" y1="290" x2="430" y2="290" stroke="#f8fafc" stroke-width="3"/>
  <line x1="650" y1="290" x2="720" y2="290" stroke="#f8fafc" stroke-width="3"/>
  <line x1="940" y1="290" x2="1010" y2="290" stroke="#f8fafc" stroke-width="3"/>
  <line x1="690" y1="360" x2="690" y2="460" stroke="#f8fafc" stroke-width="3"/>
</svg>